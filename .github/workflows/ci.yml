name: CI

# Every pull request (stacked slices target each other, not only main) and main itself.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      EDITOR_PROVIDER: mock
      OCR_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: pnpm build
      - run: pnpm exec tsx scripts/secret-scan.ts

  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ocr/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m venv services/ocr/.venv
      - run: services/ocr/.venv/bin/pip install -r services/ocr/requirements.txt
      - run: pnpm test lib/ocr/sidecar.test.ts
        env:
          RUN_OCR: "1"
      # The local editor runs in the same venv and is skipped where the venv is absent.
      - run: pnpm test lib/editor/local.test.ts
